services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koom-api
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: ${API_MEM_LIMIT:-768m}
    cpus: ${API_CPUS:-1.0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Opt-in; the API writes only to PUBLIC_FILE_DIR and /tmp.
    read_only: ${API_READ_ONLY_ROOTFS:-false}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${API_TMPFS_SIZE:-128m}
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      SMS_PROVIDER: ${SMS_PROVIDER:-smspro}
      SMSPRO_LOGIN: ${SMSPRO_LOGIN:-}
      SMSPRO_PASSWORD: ${SMSPRO_PASSWORD:-}
      SMSPRO_SENDER: ${SMSPRO_SENDER:-}
      SMS_ALLOWED_COUNTRY_PREFIXES: ${SMS_ALLOWED_COUNTRY_PREFIXES:-+996}
      SMS_GLOBAL_HOURLY_MAX: ${SMS_GLOBAL_HOURLY_MAX:-500}
      UPLOAD_DAILY_QUOTA_MB: ${UPLOAD_DAILY_QUOTA_MB:-300}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      SUPER_ADMIN_PHONES: ${SUPER_ADMIN_PHONES:-}
      PLATFORM_ADMIN_PHONES: ${PLATFORM_ADMIN_PHONES:-}
      RUN_MIGRATIONS_ON_START: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
