name: Deploy Koom production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Confirm after reviewing the production release and latest backup status.
        required: true
        type: choice
        options:
          - no
          - deploy
        default: no
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: koom-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Run unit and static checks
        run: |
          go test ./...
          go vet ./...
      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build Linux production binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          build_dir="$RUNNER_TEMP/koom-image"
          bundle_dir="$RUNNER_TEMP/koom-deploy"
          mkdir -p "$build_dir/migrations" "$bundle_dir"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -p=1 -trimpath -ldflags='-s -w' -o "$build_dir/koom-server" ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -p=1 -trimpath -ldflags='-s -w' -o "$build_dir/koom-migrate" ./cmd/migrate
          cp -R migrations/. "$build_dir/migrations/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle_dir/deploy-sha.txt"
          docker build --pull \
            --build-arg "BUILD_SHA=$GITHUB_SHA" \
            --file deployment/Dockerfile.runtime \
            --tag mobilechatserver-api:deploy \
            --tag mobilechatserver-migrate:deploy \
            "$build_dir"
          docker save --output "$bundle_dir/images.tar" \
            mobilechatserver-api:deploy mobilechatserver-migrate:deploy
          tar -C "$bundle_dir" -czf "$RUNNER_TEMP/koom-production.tar.gz" images.tar deploy-sha.txt
      - name: Upload production package
        uses: actions/upload-artifact@v7
        with:
          name: koom-production-${{ github.sha }}
          path: ${{ runner.temp }}/koom-production.tar.gz
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy to the Koom Oracle server
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out pinned server host key
        uses: actions/checkout@v7
      - name: Download the verified package
        uses: actions/download-artifact@v8
        with:
          name: koom-production-${{ github.sha }}
          path: ${{ runner.temp }}/koom-deploy
      - name: Configure restricted SSH access
        shell: bash
        env:
          KOOM_PROD_DEPLOY_KEY: ${{ secrets.KOOM_PROD_DEPLOY_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KOOM_PROD_DEPLOY_KEY" > "$HOME/.ssh/koom-production"
          chmod 600 "$HOME/.ssh/koom-production"
          install -m 600 .github/koom-production-known-hosts "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/koom-production" >/dev/null
      - name: Check production prerequisites and deploy
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/koom-production" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" opc@139.185.44.178 preflight
          ssh "${ssh_opts[@]}" opc@139.185.44.178 "deploy $GITHUB_SHA" < "$RUNNER_TEMP/koom-deploy/koom-production.tar.gz"
