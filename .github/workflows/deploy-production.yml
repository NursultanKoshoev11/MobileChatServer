name: Deploy Koom production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: koom-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the Koom production server
    runs-on: [self-hosted, linux, x64, koom-production]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy MobileChatServer
        shell: bash
        env:
          DEPLOY_DIR: /opt/projects/MobileChatServer
          COMPOSE_FILE: docker-compose.prod.yml
          ENV_FILE: .env.prod
        run: |
          set -Eeuo pipefail

          cd "$DEPLOY_DIR"
          test -f "$ENV_FILE"

          previous_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          target_sha="${GITHUB_SHA}"

          git fetch --prune origin "${GITHUB_REF_NAME:-main}"
          git checkout --force "$target_sha"

          rollback() {
            if [[ -n "$previous_sha" && "$previous_sha" != "$target_sha" ]]; then
              echo "Deployment failed; restoring $previous_sha"
              git checkout --force "$previous_sha" || true
              sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build api migrate || true
              sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d api caddy || true
            fi
          }
          trap rollback ERR

          sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build api migrate
          sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" run --rm migrate
          sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d api caddy

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Koom API health check failed"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error --resolve koom.com.kg:443:127.0.0.1 https://koom.com.kg/api/health >/dev/null
          sudo docker ps --format '{{.Names}}|{{.Status}}' | grep -E '^mobilechat-(api|caddy|postgres)\\|'

          trap - ERR
          echo "Koom deployment completed at ${target_sha}"
