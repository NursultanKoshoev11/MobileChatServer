name: Deploy Koom production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: koom-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Run unit and static checks
        run: |
          go test ./...
          go vet ./...
      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build deployment binaries
        run: |
          go build ./cmd/server
          go build ./cmd/migrate

  deploy:
    name: Deploy to the Koom production server
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, koom-production]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy MobileChatServer
        shell: bash
        env:
          DEPLOY_DIR: /opt/projects/MobileChatServer
          COMPOSE_FILE: docker-compose.prod.yml
          ENV_FILE: .env.prod
        run: |
          set -Eeuo pipefail

          if [[ ! -d "$DEPLOY_DIR" ]]; then
            echo "Configured deployment directory is missing: $DEPLOY_DIR"
            echo "Runner workspace: ${GITHUB_WORKSPACE:-unset}"
            for base in /opt /srv /etc/koom /var/lib; do
              if [[ -d "$base" ]]; then
                find "$base" -maxdepth 5 \
                  \( -type d -iname 'MobileChatServer' -o -type f -name '.env.prod' \) \
                  -print 2>/dev/null || true
              fi
            done
            sudo docker ps --format '{{.Names}}|{{.Status}}' || true
            exit 1
          fi

          cd "$DEPLOY_DIR"
          test -f "$ENV_FILE"

          if ! grep -Eq '^SMS_PROVIDER[[:space:]]*=[[:space:]]*twilio([[:space:]]*(#.*)?)?$' "$ENV_FILE" \
            || ! grep -Eq '^TWILIO_ACCOUNT_SID[[:space:]]*=[[:space:]]*[^[:space:]#]+' "$ENV_FILE" \
            || ! grep -Eq '^TWILIO_AUTH_TOKEN[[:space:]]*=[[:space:]]*[^[:space:]#]+' "$ENV_FILE" \
            || { ! grep -Eq '^SMS_FROM[[:space:]]*=[[:space:]]*[^[:space:]#]+' "$ENV_FILE" \
                 && ! grep -Eq '^TWILIO_MESSAGING_SERVICE_SID[[:space:]]*=[[:space:]]*[^[:space:]#]+' "$ENV_FILE"; }; then
            echo "Production SMS is not configured. Set SMS_PROVIDER=twilio, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, and SMS_FROM or TWILIO_MESSAGING_SERVICE_SID in .env.prod."
            exit 1
          fi
          echo "Production SMS configuration is present."

          previous_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          target_sha="${GITHUB_SHA}"

          git fetch --prune origin "${GITHUB_REF_NAME:-main}"
          git checkout --force "$target_sha"

          rollback() {
            if [[ -n "$previous_sha" && "$previous_sha" != "$target_sha" ]]; then
              echo "Deployment failed; restoring $previous_sha"
              git checkout --force "$previous_sha" || true
              sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build api migrate || true
              sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d api caddy || true
            fi
          }
          trap rollback ERR

          sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build api migrate
          sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" run --rm migrate
          sudo docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d api caddy

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Koom API health check failed"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error --resolve koom.com.kg:443:127.0.0.1 https://koom.com.kg/api/health >/dev/null
          sudo docker ps --format '{{.Names}}|{{.Status}}' | grep -E '^mobilechat-(api|caddy|postgres)\\|'

          trap - ERR
          echo "Koom deployment completed at ${target_sha}"
