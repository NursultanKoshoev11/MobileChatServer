name: Cancel temporary cleanup run

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cancel-temp-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued cleanup run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/cancel.out -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/NursultanKoshoev11/MobileChatServer/actions/runs/34580714121/cancel")"
          echo "cancel_http=$code"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            cat /tmp/cancel.out || true
            exit 1
          fi
