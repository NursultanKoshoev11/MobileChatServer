name: Probe existing AWS credentials

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-aws-ssh.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN_VALUE: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION_VALUE: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ROLE_ARN_VALUE: ${{ secrets.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID_VALUE: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Check AWS secret presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID_VALUE AWS_SECRET_ACCESS_KEY_VALUE AWS_SESSION_TOKEN_VALUE AWS_REGION_VALUE AWS_DEFAULT_REGION_VALUE AWS_ROLE_ARN_VALUE EC2_INSTANCE_ID_VALUE; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          done
