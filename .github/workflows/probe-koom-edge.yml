name: Probe Koom AWS edge

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-koom-edge.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public endpoints and ports
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DNS ==="
          getent ahostsv4 koommy.duckdns.org | head -5 || true

          echo "=== MobileChat health ==="
          curl -k -sS -D /tmp/health.headers -o /tmp/health.body -w 'HTTP=%{http_code}\n' --max-time 10 https://koommy.duckdns.org/api/health || true
          sed -n '1,20p' /tmp/health.headers || true
          head -c 500 /tmp/health.body || true
          echo

          echo "=== /stroy-site/ ==="
          curl -k -sS -L -D /tmp/stroy.headers -o /tmp/stroy.body -w 'HTTP=%{http_code}\n' --max-time 10 https://koommy.duckdns.org/stroy-site/ || true
          sed -n '1,30p' /tmp/stroy.headers || true
          echo "BODY_BYTES=$(wc -c < /tmp/stroy.body 2>/dev/null || echo 0)"
          if grep -qiE 'строительство под контролем|stroy|onlineprorab|онлайн прораб' /tmp/stroy.body 2>/dev/null; then
            echo "STROY_CONTENT=present"
          else
            echo "STROY_CONTENT=not_detected"
          fi
          head -c 600 /tmp/stroy.body || true
          echo

          echo "=== TCP ports on 16.171.171.191 ==="
          for p in 22 80 443 2019 3000 8080; do
            if timeout 3 bash -c "</dev/tcp/16.171.171.191/$p" 2>/dev/null; then
              echo "PORT_$p=open"
            else
              echo "PORT_$p=closed_or_filtered"
            fi
          done
